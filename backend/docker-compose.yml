version: '3.8'

services:
  api:
    build: .
    container_name: bs-detector-api
    ports:
      - "8000:8000"
    environment:
      - POLLINATIONS_API_TOKEN=${POLLINATIONS_API_TOKEN}
      - POLLINATIONS_MODEL=${POLLINATIONS_MODEL:-searchgpt}
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL=3600
      - CORS_ORIGINS=["*"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - bs-detector-network
    volumes:
      - ./:/app

  redis:
    image: redis:7-alpine
    container_name: bs-detector-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - bs-detector-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

networks:
  bs-detector-network:
    driver: bridge

volumes:
  redis-data:
