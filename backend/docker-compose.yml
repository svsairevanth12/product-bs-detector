version: '3.8'

services:
  backend:
    build: .
    container_name: bs-detector-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POLLINATIONS_API_TOKEN=${POLLINATIONS_API_TOKEN}
      - POLLINATIONS_MODEL=${POLLINATIONS_MODEL:-searchgpt}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    networks:
      - bs-detector-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  bs-detector-network:
    driver: bridge

volumes:
  logs:
