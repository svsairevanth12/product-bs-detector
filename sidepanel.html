<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main Analysis Screen -->
    <div id="main-screen">
        <div class="header">
            <h1>BS Detector 🕵️‍♂️</h1>
            <h2>Real Reviews. No Fluff.</h2>
        </div>

        <div id="product-title">Loading Product...</div>

        <button id="analyze-btn">Analyze This Page</button>

        <div id="loading-state" class="hidden">
            <div class="loader"></div>
            <p style="text-align:center; font-size:12px; color: #94a3b8;">Scouring the web for real opinions...</p>
        </div>

        <div id="results-area" class="hidden">
            <div style="height: 20px;"></div>

            <div class="score-box">
                <div class="score-val" id="real-score">--</div>
                <div class="score-label">Real Sentiment Score</div>
            </div>

            <div class="section">
                <div class="section-title">THE VERDICT</div>
                <div class="verdict" id="verdict-text"></div>
            </div>

            <div class="section">
                <div class="section-title" style="color: var(--danger);">DEALBREAKERS 🚩</div>
                <ul id="cons-list"></ul>
            </div>

            <div class="section">
                <div class="section-title" style="color: var(--success);">ACTUALLY GOOD STUFF 👍</div>
                <ul id="pros-list"></ul>
            </div>
            
            <div class="footer">
                Analysis based on <span id="source-count">0</span> independent discussions.
            </div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
